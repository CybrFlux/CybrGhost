name: Feature request
description: Suggest a new feature for CybrGhost
title: "[feat]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point or workflow this feature would unlock.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would the feature look like? API, UX, or example usage.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they're not as good.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, related issues.
