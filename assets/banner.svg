<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="Cybr Ghost banner">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03030A"/>
      <stop offset="50%" stop-color="#070717"/>
      <stop offset="100%" stop-color="#0A0522"/>
    </linearGradient>
    <linearGradient id="ghost-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#FF00E5"/>
    </linearGradient>
    <linearGradient id="circuit-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#FF00E5"/>
    </linearGradient>
    <radialGradient id="glow-c" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-m" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF00E5" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FF00E5" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#0F1A30" stroke-width="0.7"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="380" fill="url(#bg-grad)"/>
  <rect width="1280" height="380" fill="url(#grid)" opacity="0.55"/>

  <!-- Ambient glows -->
  <ellipse cx="200" cy="190" rx="260" ry="200" fill="url(#glow-c)"/>
  <ellipse cx="1080" cy="260" rx="320" ry="180" fill="url(#glow-m)" opacity="0.8"/>

  <!-- Scan line sweep (subtle) -->
  <rect x="0" y="150" width="1280" height="1" fill="#00F0FF" opacity="0.12"/>
  <rect x="0" y="220" width="1280" height="1" fill="#FF00E5" opacity="0.08"/>

  <!-- Ghost (left side) — scaled smaller than logo -->
  <g transform="translate(60, 50) scale(0.52)" filter="url(#bloom)">
    <path d="M 256 84
             C 176 84 108 148 108 232
             L 108 410
             C 108 424 124 430 136 418
             L 162 392
             C 174 380 194 380 206 392
             L 230 416
             C 242 428 262 428 274 416
             L 298 392
             C 310 380 330 380 342 392
             L 368 418
             C 380 430 396 424 396 410
             L 396 232
             C 396 148 336 84 256 84 Z"
          fill="url(#ghost-grad)" fill-opacity="0.17"
          stroke="url(#ghost-grad)" stroke-width="4"
          stroke-linejoin="round"/>
    <!-- eyes -->
    <circle cx="212" cy="206" r="18" fill="#00F0FF"/>
    <circle cx="300" cy="206" r="18" fill="#00F0FF"/>
    <circle cx="214" cy="204" r="6" fill="#FFFFFF"/>
    <circle cx="302" cy="204" r="6" fill="#FFFFFF"/>
    <!-- inner traces -->
    <g stroke="url(#circuit-grad)" stroke-width="2.2" fill="none" opacity="0.9">
      <path d="M 150 270 L 200 270 L 200 320 L 240 320"/>
      <path d="M 312 260 L 360 260 L 360 330"/>
      <path d="M 256 280 L 256 340"/>
    </g>
  </g>

  <!-- Title text -->
  <g transform="translate(360, 0)" font-family="'SF Pro Display', -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif">
    <text x="0" y="170" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#title-grad)" filter="url(#soft-bloom)">CYBR GHOST</text>
    <text x="4" y="210" font-size="20" font-weight="500" letter-spacing="4" fill="#7DD3FC" opacity="0.9">STEALTH BROWSER · MCP · FOR AI AGENTS</text>

    <!-- Tagline -->
    <text x="4" y="266" font-size="22" font-weight="400" fill="#CBD5E1" opacity="0.85">Drives a real Firefox. Passes Cloudflare.</text>
    <text x="4" y="294" font-size="22" font-weight="400" fill="#CBD5E1" opacity="0.85">Clicks like a human. Built to be driven by Claude.</text>

    <!-- Badges row -->
    <g transform="translate(0, 320)" font-size="13" font-weight="600">
      <g transform="translate(0, 0)">
        <rect width="120" height="28" rx="14" fill="#0F172A" stroke="#00F0FF" stroke-opacity="0.6"/>
        <text x="60" y="18" text-anchor="middle" fill="#00F0FF">PYTHON 3.12+</text>
      </g>
      <g transform="translate(132, 0)">
        <rect width="110" height="28" rx="14" fill="#0F172A" stroke="#A855F7" stroke-opacity="0.6"/>
        <text x="55" y="18" text-anchor="middle" fill="#A855F7">STEALTH</text>
      </g>
      <g transform="translate(254, 0)">
        <rect width="80" height="28" rx="14" fill="#0F172A" stroke="#FF00E5" stroke-opacity="0.6"/>
        <text x="40" y="18" text-anchor="middle" fill="#FF00E5">MCP</text>
      </g>
      <g transform="translate(346, 0)">
        <rect width="72" height="28" rx="14" fill="#0F172A" stroke="#22D3EE" stroke-opacity="0.6"/>
        <text x="36" y="18" text-anchor="middle" fill="#22D3EE">MIT</text>
      </g>
    </g>
  </g>

  <!-- Right-side data particles -->
  <g fill="#00F0FF" opacity="0.7" filter="url(#soft-bloom)">
    <rect x="1160" y="60"  width="3" height="12"/>
    <rect x="1200" y="100" width="3" height="8"/>
    <rect x="1130" y="148" width="3" height="14"/>
    <rect x="1220" y="200" width="3" height="10"/>
    <rect x="1150" y="260" width="3" height="8"/>
    <rect x="1190" y="300" width="3" height="12"/>
    <circle cx="1240" cy="80" r="2"/>
    <circle cx="1240" cy="340" r="2"/>
  </g>
  <g fill="#FF00E5" opacity="0.7" filter="url(#soft-bloom)">
    <rect x="1100" y="110" width="3" height="7"/>
    <rect x="1210" y="160" width="3" height="7"/>
    <rect x="1170" y="220" width="3" height="7"/>
    <circle cx="1110" cy="300" r="2"/>
  </g>
</svg>
